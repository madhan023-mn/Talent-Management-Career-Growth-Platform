{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account — Talent Growth{% endblock %}

{% block content %}
<div style="max-width: 620px; margin: 30px auto;" class="tab-group">
    <div class="saas-card" style="padding: 36px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="font-size: 1.6rem; font-weight: 800; color: #0F172A; margin: 0 0 6px 0;">Create Your Account</h2>
            <p style="font-size: 0.88rem; color: #64748B; margin: 0;">Start accelerating your career and workforce potential</p>
        </div>

        <!-- Account Type Selector Tabs -->
        <div style="display: flex; gap: 8px; margin-bottom: 24px; background: #F1F5F9; padding: 4px; border-radius: 12px;">
            <button type="button" class="btn-saas btn-saas-primary active" data-tab-target="tab_individual" style="flex: 1; padding: 10px; font-size: 0.88rem;">
                🚀 Individual Career Account
            </button>
            <button type="button" class="btn-saas btn-saas-secondary" data-tab-target="tab_organization" style="flex: 1; padding: 10px; font-size: 0.88rem;">
                🏢 Organization Account
            </button>
        </div>

        <!-- TAB 1: INDIVIDUAL REGISTRATION FORM -->
        <div id="tab_individual" class="tab-pane active">
            <form method="POST" action="/register/">
                {% csrf_token %}
                <input type="hidden" name="account_type" value="Individual">

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Full Name *</label>
                    <input type="text" name="name" required placeholder="e.g. Sarah Jenkins"
                        style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Email Address *</label>
                    <input type="email" name="email" required placeholder="sarah@example.com"
                        style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px;">
                    <div>
                        <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Current Role / Title</label>
                        <input type="text" name="job_title" placeholder="e.g. Frontend Developer"
                            style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Target Career Role</label>
                        <input type="text" name="target_role" placeholder="e.g. Senior Software Architect"
                            style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px;">
                    <div>
                        <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Password *</label>
                        <input type="password" name="password" required minlength="6" placeholder="••••••••••••"
                            style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Confirm Password *</label>
                        <input type="password" name="confirm_password" required minlength="6" placeholder="••••••••••••"
                            style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                    </div>
                </div>

                <button type="submit" class="btn-saas btn-saas-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; border-radius: 10px;">
                    Create Individual Account
                </button>
            </form>
        </div>

        <!-- TAB 2: ORGANIZATION REGISTRATION FORM -->
        <div id="tab_organization" class="tab-pane" style="display: none;">
            <form method="POST" action="/register/">
                {% csrf_token %}
                <input type="hidden" name="account_type" value="Organization">

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Organization Role Type</label>
                    <select name="org_reg_type" id="org_reg_type" 
                        style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem; background: #FFF;"
                        onchange="document.getElementById('org_code_field').style.display = (this.value === 'code') ? 'block' : 'none';">
                        <option value="new_org">Create New Enterprise Organization (HR Administrator)</option>
                        <option value="code">Join Existing Organization with Invitation Code</option>
                    </select>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Full Name *</label>
                    <input type="text" name="name" required placeholder="e.g. David Vance"
                        style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Corporate Email *</label>
                    <input type="email" name="email" required placeholder="david@enterprise.com"
                        style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Organization Name</label>
                    <input type="text" name="org_name" placeholder="e.g. Apex Global Solutions"
                        style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                </div>

                <div id="org_code_field" style="margin-bottom: 16px; display: none;">
                    <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Invitation Code</label>
                    <input type="text" name="invitation_code" placeholder="INV-XXXX-XXXX"
                        style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px;">
                    <div>
                        <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Password *</label>
                        <input type="password" name="password" required minlength="6" placeholder="••••••••••••"
                            style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.84rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Confirm Password *</label>
                        <input type="password" name="confirm_password" required minlength="6" placeholder="••••••••••••"
                            style="width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px; border: 1px solid #CBD5E1; font-size: 0.90rem;">
                    </div>
                </div>

                <button type="submit" class="btn-saas btn-saas-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; border-radius: 10px;">
                    Create Organization Account
                </button>
            </form>
        </div>

        <div style="margin-top: 24px; text-align: center; font-size: 0.86rem; color: #64748B;">
            Already have an account? <a href="/login/" style="color: #2563EB; font-weight: 600; text-decoration: none;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
