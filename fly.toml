# Fly.io Configuration for 24/7 Persistent Streamlit Deployment
app = "talent-growth-platform"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/app/data/talentsphere.db"

[mounts]
  source = "talent_growth_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  # CRITICAL: Setting auto_stop_machines to false ensures the app NEVER sleeps
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/_stcore/health"
  timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
